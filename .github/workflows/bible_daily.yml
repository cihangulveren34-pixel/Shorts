name: BIBLE SHORTS — Daily Pipeline

on:
  workflow_dispatch:        # Sadece manuel tetikleme
    inputs:
      topic:
        description: 'Belirli bir hikaye indexi (0-based, boş bırakılırsa otomatik seçilir)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (upload olmadan test)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-bible-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used bible topics cache
        uses: actions/cache@v4
        with:
          path: bible_used_topics.json
          key: bible-used-topics-${{ github.run_id }}
          restore-keys: |
            bible-used-topics-

      - name: Restore bible_seen_pexels_ids cache
        uses: actions/cache@v4
        with:
          path: output/bible_seen_pexels_ids.json
          key: bible-seen-pexels-${{ github.run_id }}
          restore-keys: |
            bible-seen-pexels-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-noto-core libpango1.0-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run BIBLE SHORTS pipeline
        run: |
          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_ARG="--topic ${{ github.event.inputs.topic }}"
          fi
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python bible_main.py $TOPIC_ARG $DRY_ARG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save used bible topics cache
        if: always()
        uses: actions/cache@v4
        with:
          path: bible_used_topics.json
          key: bible-used-topics-${{ github.run_id }}

      - name: Save bible_seen_pexels_ids cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/bible_seen_pexels_ids.json
          key: bible-seen-pexels-${{ github.run_id }}

      - name: Commit bible state files (kalıcı dedup)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bible_used_topics.json || true
          git add output/bible_seen_pexels_ids.json || true
          git diff --cached --quiet || git commit -m "chore: update bible state after daily run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      - name: Upload output artifacts (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bible-pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 3
