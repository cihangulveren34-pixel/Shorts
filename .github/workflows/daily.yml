name: WAR SHORTS — Daily Pipeline

on:
  schedule:
    - cron: '0 9 * * *'   # Her gün 09:00 UTC
  workflow_dispatch:        # Manuel tetikleme

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used_topics cache
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-${{ github.run_id }}
          restore-keys: |
            used-topics-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save used_topics cache
        if: always()
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-${{ github.run_id }}

      - name: Upload output artifacts (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 3
