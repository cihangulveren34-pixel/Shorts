name: WAR SHORTS — Daily Pipeline

on:
  schedule:
    - cron: '0 9 * * *'   # Her gün 09:00 UTC
  workflow_dispatch:        # Manuel tetikleme

jobs:
  run-pipeline:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used_topics cache
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-${{ github.run_id }}
          restore-keys: |
            used-topics-

      - name: Restore RSS state cache
        uses: actions/cache@v4
        with:
          path: rss_state.json
          key: rss-state-${{ github.run_id }}
          restore-keys: |
            rss-state-

      - name: Restore playlist IDs cache
        uses: actions/cache@v4
        with:
          path: playlist_ids.json
          key: playlist-ids-${{ github.run_id }}
          restore-keys: |
            playlist-ids-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation

      - name: Install Python dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Run pipeline
        shell: bash
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_QUEUE: ${{ vars.USE_QUEUE || 'false' }}
          GOOGLE_DRIVE_BACKUP: ${{ vars.GOOGLE_DRIVE_BACKUP || 'false' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMPETITOR_CHANNEL_IDS: ${{ vars.COMPETITOR_CHANNEL_IDS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TRANSLATE_LANGUAGES: ${{ vars.TRANSLATE_LANGUAGES || 'es,fr,pt' }}

      - name: Save last_video cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/last_video.json
          key: last-video-${{ github.run_id }}

      - name: Save A/B state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/ab_state.json
          key: ab-state-${{ github.run_id }}

      - name: Save RSS state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: rss_state.json
          key: rss-state-${{ github.run_id }}

      - name: Save playlist IDs cache
        if: always()
        uses: actions/cache@v4
        with:
          path: playlist_ids.json
          key: playlist-ids-${{ github.run_id }}

      - name: Save used_topics cache
        if: always()
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-${{ github.run_id }}

      - name: Upload output artifacts (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 3
