name: WAR SHORTS — Sentiment Analysis & Schedule Optimizer

on:
  schedule:
    - cron: '0 6 * * 1'   # Her Pazartesi 06:00 UTC (haftalık analiz)
  workflow_dispatch:        # Manuel tetikleme

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore sentiment state cache
        uses: actions/cache@v4
        with:
          path: |
            output/sentiment_report.json
            output/optimal_schedule.json
          key: sentiment-schedule-${{ github.run_id }}
          restore-keys: |
            sentiment-schedule-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run sentiment analysis
        run: python sentiment_analyzer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Run schedule optimizer
        run: python smart_scheduler.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Save analysis cache
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            output/sentiment_report.json
            output/optimal_schedule.json
          key: sentiment-schedule-${{ github.run_id }}

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-schedule-${{ github.run_id }}
          path: |
            output/sentiment_report.json
            output/optimal_schedule.json
          retention-days: 14
