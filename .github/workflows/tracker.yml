name: WAR SHORTS — Competitor Tracker

on:
  schedule:
    - cron: '0 7 * * 1'   # Her Pazartesi 07:00 UTC (weekly rapor öncesi)
  workflow_dispatch:        # Manuel tetikleme

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore competitor state cache
        uses: actions/cache@v4
        with:
          path: competitor_state.json
          key: competitor-state-${{ github.run_id }}
          restore-keys: |
            competitor-state-

      - name: Restore topic pool cache
        uses: actions/cache@v4
        with:
          path: topic_pool.json
          key: topic-pool-${{ github.run_id }}
          restore-keys: |
            topic-pool-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run competitor tracker
        run: python competitor_tracker.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMPETITOR_CHANNEL_IDS: ${{ vars.COMPETITOR_CHANNEL_IDS }}

      - name: Save competitor state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: competitor_state.json
          key: competitor-state-${{ github.run_id }}

      - name: Save topic pool cache
        if: always()
        uses: actions/cache@v4
        with:
          path: topic_pool.json
          key: topic-pool-${{ github.run_id }}

      - name: Upload tracker results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-results-${{ github.run_id }}
          path: competitor_state.json
          retention-days: 7
