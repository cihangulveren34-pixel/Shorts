name: FREQ SHORTS — Daily Pipeline

on:
  schedule:
    - cron: '0 1 * * *'    # Her gün 01:00 UTC
  workflow_dispatch:
    inputs:
      hz:
        description: 'Belirli bir Hz değeri (boş bırakılırsa otomatik seçilir)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (upload olmadan test)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-freq-pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.ACTIVE_SYSTEM == 'Hz'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used freq cache
        uses: actions/cache@v4
        with:
          path: freq_used_topics.json
          key: freq-used-topics-${{ github.run_id }}
          restore-keys: |
            freq-used-topics-

      - name: Restore freq_seen_pexels_ids cache
        uses: actions/cache@v4
        with:
          path: output/freq_seen_pexels_ids.json
          key: freq-seen-pexels-${{ github.run_id }}
          restore-keys: |
            freq-seen-pexels-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-noto-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run FREQ SHORTS pipeline
        run: |
          HZ_ARG=""
          if [ -n "${{ github.event.inputs.hz }}" ]; then
            HZ_ARG="--hz ${{ github.event.inputs.hz }}"
          fi
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python freq_main.py $HZ_ARG $DRY_ARG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_FREQ_QUEUE: ${{ vars.USE_FREQ_QUEUE || 'false' }}

      - name: Save used freq cache
        if: always()
        uses: actions/cache@v4
        with:
          path: freq_used_topics.json
          key: freq-used-topics-${{ github.run_id }}

      - name: Save freq_seen_pexels_ids cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/freq_seen_pexels_ids.json
          key: freq-seen-pexels-${{ github.run_id }}

      - name: Commit freq state files (kalıcı dedup)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add freq_used_topics.json || true
          git add output/freq_seen_pexels_ids.json || true
          git diff --cached --quiet || git commit -m "chore: update freq state after daily run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      - name: Upload output artifacts (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freq-pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 3
