name: YouTube OAuth Token Kurulumu (pytubefix)

on:
  workflow_dispatch:   # Sadece manuel tetikleme

jobs:
  generate-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytubefix
        run: pip install -U pytubefix

      - name: ">>> OAUTH BAŞLAT — Logları takip et! <<<"
        run: |
          echo "============================================"
          echo " Aşağıda bir URL ve kod göreceksin."
          echo " 1) URL'yi telefonunda aç"
          echo " 2) Google hesabınla giriş yap"
          echo " 3) Kodu gir ve 'İzin Ver' tıkla"
          echo " 4) Buraya geri dön — token otomatik oluşacak"
          echo "============================================"
          echo ""

          python3 << 'PYEOF'
          import json, os, sys

          try:
              from pytubefix import YouTube
          except ImportError:
              print("pytubefix kurulamadı!")
              sys.exit(1)

          token_file = "/tmp/pytubefix_oauth.json"

          # OAuth device-code flow başlat
          # pytubefix ekrana URL + kodu basar, kullanıcı onayını bekler
          try:
              yt = YouTube(
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                  client="ANDROID_TESTSUITE",
                  use_oauth=True,
                  allow_oauth_cache=True,
                  token_file=token_file,
              )
              # Streams'e erişim token'ı tetikler
              title = yt.title
              print(f"\nVideo başlığı: {title}")
              print("OAuth başarılı!")
          except Exception as e:
              print(f"OAuth hatası: {e}")
              # Token yine de oluşmuş olabilir
              if not os.path.isfile(token_file):
                  sys.exit(1)

          if os.path.isfile(token_file):
              with open(token_file) as f:
                  data = f.read().strip()
              print(f"\nToken dosyası oluşturuldu ({len(data)} byte)")
              # Token'ı output'a yaz (sonraki step okuyacak)
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as out:
                  # Multiline output
                  out.write(f"token<<TOKENEOF\n{data}\nTOKENEOF\n")
          else:
              print("Token dosyası oluşturulamadı!")
              sys.exit(1)
          PYEOF

      - name: Token'ı Summary'ye yaz
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'HEADER'
          ## YouTube OAuth Token Hazır

          Aşağıdaki JSON'ı GitHub Secret olarak kaydet:

          1. Bu repo → **Settings** → **Secrets and variables** → **Actions**
          2. **New repository secret** tıkla
          3. Name: `PYTUBEFIX_OAUTH_TOKEN`
          4. Value: Aşağıdaki JSON'ı kopyala-yapıştır
          5. **Add secret** tıkla

          ```json
          HEADER

          # Token'ı dosyadan oku
          if [ -f /tmp/pytubefix_oauth.json ]; then
            cat /tmp/pytubefix_oauth.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"error": "Token oluşturulamadı"}' >> "$GITHUB_STEP_SUMMARY"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << 'FOOTER'
          ```

          > Bu token ile YouTube datacenter IP kısıtlaması aşılır.
          > Token süresi dolunca bu workflow'u tekrar çalıştır.
          FOOTER

          echo ""
          echo "============================================"
          echo " TOKEN HAZIR!"
          echo " Actions sekmesinde 'Summary' bölümüne bak."
          echo " Oradaki JSON'ı Secret olarak kaydet."
          echo "============================================"
