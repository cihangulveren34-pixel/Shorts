name: YouTube Bağlantı Testi

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Test edilecek video ID (varsayılan: jNQXAC9IVRw)'
        default: 'jNQXAC9IVRw'

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      warp:
        image: monius/docker-warp-socks:v5
        ports:
          - 9091:9091

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U "yt-dlp[default]" pytubefix

      - name: Wait for WARP proxy
        run: |
          for i in $(seq 1 15); do
            if curl -s --socks5h localhost:9091 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp=on"; then
              echo "WARP hazır! (${i}. deneme)"
              curl -s --socks5h localhost:9091 https://cloudflare.com/cdn-cgi/trace
              exit 0
            fi
            sleep 2
          done
          echo "::warning::WARP proxy başlatılamadı"

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > yt_cookies.txt
            echo "Cookies yazıldı ($(wc -c < yt_cookies.txt) byte)"
          else
            echo "::warning::YT_COOKIES secret ayarlanmamış!"
          fi

      - name: "Test: WARP + pytubefix (PO token)"
        id: warp_po
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube

          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          url = f"https://www.youtube.com/watch?v={vid}"
          proxies = {"https": "socks5h://localhost:9091", "http": "socks5h://localhost:9091"}

          clients = ["ANDROID_TESTSUITE", "ANDROID_VR", "IOS", "WEB"]
          for client in clients:
              print(f"\n--- WARP + {client} + PO token ---")
              try:
                  yt = YouTube(url, client=client, use_po_token=True, proxies=proxies)
                  streams = yt.streams.filter(file_extension="mp4")
                  print(f"  Başlık: {yt.title}")
                  print(f"  Stream sayısı: {len(streams)}")
                  if streams:
                      s = streams.order_by("resolution").desc().first()
                      print(f"  En iyi: {s.resolution} ({s.filesize_mb:.1f} MB)")
                      sys.exit(0)
              except Exception as e:
                  print(f"  HATA: {str(e)[:150]}")
          sys.exit(1)
          PYEOF

      - name: "Test: WARP + pytubefix (plain)"
        id: warp_plain
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube

          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          url = f"https://www.youtube.com/watch?v={vid}"
          proxies = {"https": "socks5h://localhost:9091", "http": "socks5h://localhost:9091"}

          clients = ["ANDROID_TESTSUITE", "ANDROID_VR", "IOS", "WEB"]
          for client in clients:
              print(f"\n--- WARP + {client} (plain) ---")
              try:
                  yt = YouTube(url, client=client, proxies=proxies)
                  streams = yt.streams.filter(file_extension="mp4")
                  print(f"  Başlık: {yt.title}")
                  print(f"  Stream sayısı: {len(streams)}")
                  if streams:
                      s = streams.order_by("resolution").desc().first()
                      print(f"  En iyi: {s.resolution} ({s.filesize_mb:.1f} MB)")
                      sys.exit(0)
              except Exception as e:
                  print(f"  HATA: {str(e)[:150]}")
          sys.exit(1)
          PYEOF

      - name: "Test: WARP + yt-dlp"
        id: warp_ytdlp
        continue-on-error: true
        run: |
          vid="${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          cookie_arg=""
          if [ -f yt_cookies.txt ]; then
            cookie_arg="--cookies yt_cookies.txt"
          fi

          yt-dlp \
            --proxy socks5h://localhost:9091 \
            --skip-download \
            --print "title" \
            --print "format_id" \
            $cookie_arg \
            "https://www.youtube.com/watch?v=$vid" 2>&1

      - name: "Test: Proxy'siz pytubefix (karşılaştırma)"
        id: no_proxy
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube
          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          try:
              yt = YouTube(f"https://www.youtube.com/watch?v={vid}", client="ANDROID_TESTSUITE")
              streams = yt.streams.filter(file_extension="mp4")
              print(f"Başlık: {yt.title}, Stream: {len(streams)}")
              sys.exit(0 if streams else 1)
          except Exception as e:
              print(f"HATA: {str(e)[:150]}")
              sys.exit(1)
          PYEOF

      - name: Sonuçları özetle
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "         YOUTUBE TEST SONUÇLARI"
          echo "========================================"

          warp_po="${{ steps.warp_po.outcome }}"
          warp_plain="${{ steps.warp_plain.outcome }}"
          warp_ytdlp="${{ steps.warp_ytdlp.outcome }}"
          no_proxy="${{ steps.no_proxy.outcome }}"

          [ "$warp_po" = "success" ] && echo "✅ WARP + pytubefix + PO token → ÇALIŞIYOR" || echo "❌ WARP + pytubefix + PO token → BAŞARISIZ"
          [ "$warp_plain" = "success" ] && echo "✅ WARP + pytubefix plain     → ÇALIŞIYOR" || echo "❌ WARP + pytubefix plain     → BAŞARISIZ"
          [ "$warp_ytdlp" = "success" ] && echo "✅ WARP + yt-dlp              → ÇALIŞIYOR" || echo "❌ WARP + yt-dlp              → BAŞARISIZ"
          [ "$no_proxy" = "success" ] && echo "✅ Proxy'siz (karşılaştırma)  → ÇALIŞIYOR" || echo "❌ Proxy'siz (karşılaştırma)  → BAŞARISIZ"

          echo "========================================"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## YouTube Test Sonuçları

          | Yöntem | Sonuç |
          |--------|-------|
          | WARP + pytubefix + PO token | $([ "$warp_po" = "success" ] && echo "✅" || echo "❌") |
          | WARP + pytubefix plain | $([ "$warp_plain" = "success" ] && echo "✅" || echo "❌") |
          | WARP + yt-dlp | $([ "$warp_ytdlp" = "success" ] && echo "✅" || echo "❌") |
          | Proxy'siz (karşılaştırma) | $([ "$no_proxy" = "success" ] && echo "✅" || echo "❌") |
          EOF
