name: YouTube OAuth Token Kurulumu (pytubefix)

on:
  workflow_dispatch:   # Sadece manuel tetikleme

jobs:
  generate-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytubefix
        run: pip install -U pytubefix

      - name: ">>> OAUTH BAŞLAT — Logları takip et! <<<"
        run: |
          python3 << 'PYEOF'
          import json, os, sys, time

          try:
              from pytubefix import YouTube
          except ImportError:
              print("pytubefix import hatası!")
              sys.exit(1)

          token_file = "/tmp/pytubefix_oauth.json"

          # Özel verifier: input() yerine poll ile bekle.
          # GitHub Actions'ta stdin yok, bu yüzden input() EOF verir.
          # Bu callback sadece URL+kodu yazdırır, pytubefix arka planda
          # Google'ın token endpoint'ini otomatik pollar.
          def ci_oauth_verifier(verification_url, user_code):
              print("")
              print("=" * 55)
              print("  TELEFONUNDA ŞUNU YAP:")
              print("=" * 55)
              print(f"  1) Bu URL'yi aç: {verification_url}")
              print(f"  2) Bu kodu gir:  {user_code}")
              print("  3) Google hesabınla izin ver")
              print("=" * 55)
              print("")
              print("Onayını bekliyorum... (5 dakika süren var)")
              print("")
              # input() çağırmıyoruz — pytubefix kendi polling'ini yapacak

          try:
              yt = YouTube(
                  "https://www.youtube.com/watch?v=jNQXAC9IVRw",
                  client="ANDROID_TESTSUITE",
                  use_oauth=True,
                  allow_oauth_cache=True,
                  token_file=token_file,
                  oauth_verifier=ci_oauth_verifier,
              )
              # title'a erişim OAuth flow'u tamamlanmasını tetikler
              title = yt.title
              print(f"\nVideo başlığı: {title}")
              print("OAuth BAŞARILI!")
          except Exception as e:
              print(f"\nOAuth hatası: {e}")
              if not os.path.isfile(token_file):
                  sys.exit(1)

          if os.path.isfile(token_file):
              with open(token_file) as f:
                  data = f.read().strip()
              print(f"\nToken dosyası oluşturuldu ({len(data)} byte)")
          else:
              print("Token dosyası oluşturulamadı!")
              sys.exit(1)
          PYEOF

      - name: Token'ı Summary'ye yaz
        run: |
          if [ ! -f /tmp/pytubefix_oauth.json ]; then
            echo "::error::Token dosyası bulunamadı!"
            exit 1
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << 'HEADER'
          ## YouTube OAuth Token Hazır

          Aşağıdaki JSON'ı GitHub Secret olarak kaydet:

          1. Bu repo → **Settings** → **Secrets and variables** → **Actions**
          2. **New repository secret** tıkla
          3. Name: `PYTUBEFIX_OAUTH_TOKEN`
          4. Value: Aşağıdaki JSON'ı kopyala-yapıştır
          5. **Add secret** tıkla

          ```json
          HEADER

          cat /tmp/pytubefix_oauth.json >> "$GITHUB_STEP_SUMMARY"

          cat >> "$GITHUB_STEP_SUMMARY" << 'FOOTER'
          ```

          > Token süresi dolunca bu workflow'u tekrar çalıştır.
          FOOTER

          echo ""
          echo "========================================"
          echo " TOKEN HAZIR!"
          echo " Summary sekmesine bak, JSON'ı kopyala."
          echo "========================================"
