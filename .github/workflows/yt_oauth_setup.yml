name: YouTube Bağlantı Testi

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Test edilecek video ID (varsayılan: jNQXAC9IVRw)'
        default: 'jNQXAC9IVRw'

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -U yt-dlp pytubefix

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > yt_cookies.txt
            echo "Cookies yazıldı ($(wc -c < yt_cookies.txt) byte)"
          else
            echo "::warning::YT_COOKIES secret ayarlanmamış!"
          fi

      - name: Restore pytubefix OAuth token
        env:
          PYTUBEFIX_OAUTH_TOKEN: ${{ secrets.PYTUBEFIX_OAUTH_TOKEN }}
        run: |
          if [ -n "$PYTUBEFIX_OAUTH_TOKEN" ]; then
            echo "$PYTUBEFIX_OAUTH_TOKEN" > .pytubefix_oauth.json
            echo "pytubefix OAuth token restored."
          fi

      - name: "Test: pytubefix PO token"
        id: po_token
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube

          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          url = f"https://www.youtube.com/watch?v={vid}"

          clients = ["ANDROID_TESTSUITE", "ANDROID_VR", "IOS", "TV", "MEDIA_CONNECT", "WEB"]
          for client in clients:
              print(f"\n--- {client} + PO token ---")
              try:
                  yt = YouTube(url, client=client, use_po_token=True)
                  streams = yt.streams.filter(file_extension="mp4")
                  print(f"  Başlık: {yt.title}")
                  print(f"  Stream sayısı: {len(streams)}")
                  if streams:
                      s = streams.order_by("resolution").desc().first()
                      print(f"  En iyi: {s.resolution} ({s.filesize_mb:.1f} MB)")
                      print("PO_TOKEN_WORKS=true")
                      sys.exit(0)
              except Exception as e:
                  print(f"  HATA: {str(e)[:120]}")

          print("\nPO_TOKEN_WORKS=false")
          sys.exit(1)
          PYEOF

      - name: "Test: pytubefix plain (auth'suz)"
        id: plain
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube

          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          url = f"https://www.youtube.com/watch?v={vid}"

          clients = ["ANDROID_TESTSUITE", "ANDROID_VR", "IOS", "TV", "MEDIA_CONNECT", "WEB"]
          for client in clients:
              print(f"\n--- {client} (plain) ---")
              try:
                  yt = YouTube(url, client=client)
                  streams = yt.streams.filter(file_extension="mp4")
                  print(f"  Başlık: {yt.title}")
                  print(f"  Stream sayısı: {len(streams)}")
                  if streams:
                      s = streams.order_by("resolution").desc().first()
                      print(f"  En iyi: {s.resolution} ({s.filesize_mb:.1f} MB)")
                      print("PLAIN_WORKS=true")
                      sys.exit(0)
              except Exception as e:
                  print(f"  HATA: {str(e)[:120]}")

          print("\nPLAIN_WORKS=false")
          sys.exit(1)
          PYEOF

      - name: "Test: yt-dlp + cookies"
        id: ytdlp
        continue-on-error: true
        run: |
          vid="${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          cookie_arg=""
          if [ -f yt_cookies.txt ]; then
            cookie_arg="--cookies yt_cookies.txt"
          fi

          for client in ios android web_creator web tv; do
            echo ""
            echo "--- yt-dlp $client ---"
            yt-dlp \
              --skip-download \
              --print "title" \
              --print "formats_table" \
              --extractor-args "youtube:player_client=$client" \
              --no-check-certificate \
              $cookie_arg \
              "https://www.youtube.com/watch?v=$vid" 2>&1 && exit 0 || true
          done
          exit 1

      - name: Sonuçları özetle
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "         YOUTUBE TEST SONUÇLARI"
          echo "========================================"
          echo ""

          po="${{ steps.po_token.outcome }}"
          plain="${{ steps.plain.outcome }}"
          ytdlp="${{ steps.ytdlp.outcome }}"

          if [ "$po" = "success" ]; then
            echo "✅ pytubefix + PO token  → ÇALIŞIYOR"
            echo "   → Hiçbir setup'a gerek yok!"
          else
            echo "❌ pytubefix + PO token  → BAŞARISIZ"
          fi

          if [ "$plain" = "success" ]; then
            echo "✅ pytubefix plain       → ÇALIŞIYOR"
          else
            echo "❌ pytubefix plain       → BAŞARISIZ"
          fi

          if [ "$ytdlp" = "success" ]; then
            echo "✅ yt-dlp + cookies      → ÇALIŞIYOR"
          else
            echo "❌ yt-dlp + cookies      → BAŞARISIZ"
          fi

          echo ""

          if [ "$po" = "success" ] || [ "$plain" = "success" ] || [ "$ytdlp" = "success" ]; then
            echo "En az bir yöntem çalışıyor — pipeline YouTube'dan video indirebilir."
          else
            echo "⚠️  HİÇBİR YÖNTEM ÇALIŞMIYOR!"
            echo ""
            echo "Çözüm: YT_COOKIES secret'ını taze cookies ile güncelle."
            echo "Tarayıcında YouTube'a gir → cookies'i export et → Secret'a yapıştır."
            echo ""
            echo "Chrome eklentisi: 'Get cookies.txt LOCALLY'"
            echo "Firefox eklentisi: 'cookies.txt'"
          fi
          echo "========================================"

          # Summary'ye de yaz
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## YouTube Test Sonuçları

          | Yöntem | Sonuç |
          |--------|-------|
          | pytubefix + PO token | $([ "$po" = "success" ] && echo "✅ Çalışıyor" || echo "❌ Başarısız") |
          | pytubefix plain | $([ "$plain" = "success" ] && echo "✅ Çalışıyor" || echo "❌ Başarısız") |
          | yt-dlp + cookies | $([ "$ytdlp" = "success" ] && echo "✅ Çalışıyor" || echo "❌ Başarısız") |
          EOF
