name: YouTube Bağlantı Testi

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Test edilecek video ID (varsayılan: jNQXAC9IVRw)'
        default: 'jNQXAC9IVRw'

jobs:
  test-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno (yt-dlp EJS runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: pip install -U "yt-dlp[default]" pytubefix

      - name: Install & start Cloudflare WARP
        run: |
          # Cloudflare WARP CLI kur
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp

          # WARP'ı proxy modunda başlat (SOCKS5 :40000)
          # TOS kabul et, register ol, proxy moduna geç
          yes | warp-cli registration new 2>/dev/null || true
          warp-cli mode proxy
          warp-cli proxy port 40000
          warp-cli connect

          # Bağlantıyı bekle
          for i in $(seq 1 20); do
            result=$(curl -s --socks5h 127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "fail")
            if echo "$result" | grep -q "warp=on"; then
              echo "WARP aktif! (${i}. deneme)"
              echo "$result"
              exit 0
            fi
            echo "Bekleniyor... ($i/20) — $result"
            sleep 2
          done
          echo "::error::WARP bağlantısı kurulamadı!"
          warp-cli status
          exit 1

      - name: WARP IP kontrolü
        run: |
          echo "=== WARP IP ==="
          curl -s --socks5h 127.0.0.1:40000 https://ipinfo.io 2>/dev/null || echo "WARP üzerinden IP alınamadı"
          echo ""
          echo "=== Direkt IP ==="
          curl -s https://ipinfo.io 2>/dev/null || echo "Direkt IP alınamadı"

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > yt_cookies.txt
            echo "Cookies yazıldı ($(wc -c < yt_cookies.txt) byte)"
          fi

      - name: "Test 1: WARP + yt-dlp"
        id: warp_ytdlp
        continue-on-error: true
        run: |
          vid="${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          cookie_arg=""
          [ -f yt_cookies.txt ] && cookie_arg="--cookies yt_cookies.txt"

          yt-dlp \
            --proxy socks5h://127.0.0.1:40000 \
            --skip-download \
            --print "title" \
            --print "format_id" \
            --sleep-interval 2 \
            $cookie_arg \
            "https://www.youtube.com/watch?v=$vid" 2>&1

      - name: "Test 2: WARP + pytubefix"
        id: warp_ptf
        continue-on-error: true
        run: |
          python3 << PYEOF
          import sys
          from pytubefix import YouTube

          vid = "${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          url = f"https://www.youtube.com/watch?v={vid}"
          proxies = {"https": "socks5h://127.0.0.1:40000", "http": "socks5h://127.0.0.1:40000"}

          for client in ["ANDROID_TESTSUITE", "IOS", "WEB"]:
              print(f"\n--- WARP + {client} ---")
              try:
                  yt = YouTube(url, client=client, proxies=proxies)
                  streams = yt.streams.filter(file_extension="mp4")
                  print(f"  Başlık: {yt.title}")
                  print(f"  Stream sayısı: {len(streams)}")
                  if streams:
                      s = streams.order_by("resolution").desc().first()
                      print(f"  En iyi: {s.resolution} ({s.filesize_mb:.1f} MB)")
                      sys.exit(0)
              except Exception as e:
                  print(f"  HATA: {str(e)[:200]}")
          sys.exit(1)
          PYEOF

      - name: "Test 3: Proxy'siz yt-dlp (karşılaştırma)"
        id: no_proxy_ytdlp
        continue-on-error: true
        run: |
          vid="${{ inputs.video_id || 'jNQXAC9IVRw' }}"
          cookie_arg=""
          [ -f yt_cookies.txt ] && cookie_arg="--cookies yt_cookies.txt"

          yt-dlp \
            --skip-download \
            --print "title" \
            --print "format_id" \
            $cookie_arg \
            "https://www.youtube.com/watch?v=$vid" 2>&1

      - name: Sonuçları özetle
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "         YOUTUBE TEST SONUÇLARI"
          echo "========================================"

          r1="${{ steps.warp_ytdlp.outcome }}"
          r2="${{ steps.warp_ptf.outcome }}"
          r3="${{ steps.no_proxy_ytdlp.outcome }}"

          [ "$r1" = "success" ] && echo "✅ WARP + yt-dlp      → ÇALIŞIYOR" || echo "❌ WARP + yt-dlp      → BAŞARISIZ"
          [ "$r2" = "success" ] && echo "✅ WARP + pytubefix   → ÇALIŞIYOR" || echo "❌ WARP + pytubefix   → BAŞARISIZ"
          [ "$r3" = "success" ] && echo "✅ Proxy'siz yt-dlp   → ÇALIŞIYOR" || echo "❌ Proxy'siz yt-dlp   → BAŞARISIZ"

          echo "========================================"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## YouTube Test Sonuçları

          | Yöntem | Sonuç |
          |--------|-------|
          | WARP + yt-dlp | $([ "$r1" = "success" ] && echo "✅" || echo "❌") |
          | WARP + pytubefix | $([ "$r2" = "success" ] && echo "✅" || echo "❌") |
          | Proxy'siz yt-dlp (karşılaştırma) | $([ "$r3" = "success" ] && echo "✅" || echo "❌") |
          EOF
