name: WAR SHORTS — Haftalık Batch Üretim

on:
  schedule:
    - cron: '0 6 * * 0'   # Her Pazar 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Kaç video üretilsin?'
        default: '7'
      dry_run:
        description: 'Dry run (sadece script)?'
        type: boolean
        default: false

jobs:
  batch-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update yt-dlp to latest
        run: pip install -U yt-dlp

      - name: Write YouTube cookies
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > yt_cookies.txt
          fi
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: Download assets (SFX & music)
        run: python setup_assets.py

      - name: Run batch producer
        run: |
          python batch_producer.py \
            --count ${{ inputs.count || '7' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}

      - name: Upload batch videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-videos-${{ github.run_id }}
          path: batch_output/
          retention-days: 10

      - name: Commit used topics state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json scheduled_queue.json || true
          git diff --cached --quiet || git commit -m "Update used topics and queue state [skip ci]"
          git push || true
