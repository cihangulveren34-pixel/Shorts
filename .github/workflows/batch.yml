name: WAR SHORTS — Haftalık Batch Üretim

on:
  schedule:
    - cron: '0 6 * * 0'   # Her Pazar 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Kaç video üretilsin?'
        default: '7'
      dry_run:
        description: 'Dry run (sadece script)?'
        type: boolean
        default: false

jobs:
  batch-produce:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Download assets (SFX & music)
        shell: bash
        run: python setup_assets.py

      - name: Run batch producer
        shell: bash
        run: |
          python batch_producer.py \
            --count ${{ inputs.count || '7' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}

      - name: Build weekly compilation
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: python weekly_compilation.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload batch videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-videos-${{ github.run_id }}
          path: batch_output/
          retention-days: 10

      - name: Commit used topics state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json scheduled_queue.json || true
          git diff --cached --quiet || git commit -m "Update used topics and queue state [skip ci]"
          git push || true
