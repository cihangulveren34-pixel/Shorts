name: WAR SHORTS — Haftalık Batch Üretim

on:
  schedule:
    - cron: '0 6 * * 0'   # Her Pazar 06:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: 'Kaç video üretilsin?'
        default: '7'
      dry_run:
        description: 'Dry run (sadece script)?'
        type: boolean
        default: false

jobs:
  batch-produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 7 video için ~90 dk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            used_topics.json
            scheduled_queue.json
          key: batch-state-${{ github.run_id }}
          restore-keys: |
            batch-state-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download assets (SFX & music)
        run: python setup_assets.py
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Run batch producer
        run: |
          python batch_producer.py \
            --count ${{ inputs.count || '7' }} \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANGUAGE: ${{ vars.LANGUAGE || 'en' }}

      - name: Build weekly compilation
        if: ${{ inputs.dry_run != 'true' }}
        run: python weekly_compilation.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Upload batch videos as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batch-videos-${{ github.run_id }}
          path: batch_output/
          retention-days: 10

      - name: Save state caches
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            used_topics.json
            scheduled_queue.json
          key: batch-state-${{ github.run_id }}
