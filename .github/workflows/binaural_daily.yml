name: BINAURAL GEOMETRY SHORTS — Daily Pipeline

on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: 'Belirli bir topic index (bos birakilirsa otomatik secilir)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (upload olmadan test)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-binaural-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used binaural topics cache
        uses: actions/cache@v4
        with:
          path: binaural_used_topics.json
          key: binaural-used-topics-${{ github.run_id }}
          restore-keys: |
            binaural-used-topics-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            fonts-liberation \
            fonts-noto-core \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Manim (binaural pipeline only)
        run: pip install "manim>=0.18.0"

      - name: Run BINAURAL GEOMETRY pipeline
        run: |
          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic_index }}" ]; then
            TOPIC_ARG="--topic ${{ github.event.inputs.topic_index }}"
          fi
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python binaural_main.py $TOPIC_ARG $DRY_ARG
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save used binaural topics cache
        if: always()
        uses: actions/cache@v4
        with:
          path: binaural_used_topics.json
          key: binaural-used-topics-${{ github.run_id }}

      - name: Commit binaural state files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaural_used_topics.json || true
          git diff --cached --quiet || git commit -m "chore: update binaural state after daily run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaural-pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 7
