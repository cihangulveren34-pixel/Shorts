name: WAR SHORTS — Arabic Batch

on:
  schedule:
    - cron: '0 3 * * *'    # Her gün 03:00 UTC
  workflow_dispatch:

jobs:
  run-arabic-pipeline:
    if: github.event_name == 'workflow_dispatch' || vars.ACTIVE_SYSTEM == 'ar'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore used_topics cache
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-ar-${{ github.run_id }}
          restore-keys: |
            used-topics-ar-

      - name: Restore RSS state cache
        uses: actions/cache@v4
        with:
          path: rss_state.json
          key: rss-state-ar-${{ github.run_id }}
          restore-keys: |
            rss-state-ar-

      - name: Restore playlist IDs cache
        uses: actions/cache@v4
        with:
          path: playlist_ids.json
          key: playlist-ids-ar-${{ github.run_id }}
          restore-keys: |
            playlist-ids-ar-

      - name: Restore seen clip IDs cache
        uses: actions/cache@v4
        with:
          path: output/seen_clip_ids.json
          key: seen-clip-ids-ar-${{ github.run_id }}
          restore-keys: |
            seen-clip-ids-ar-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deno (yt-dlp EJS runtime)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies (including Arabic fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-liberation fonts-noto-core fonts-noto-extra

      - name: Install & start Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
          sudo systemctl start warp-svc || sudo warp-svc &
          for i in $(seq 1 10); do
            if warp-cli --accept-tos status 2>/dev/null | grep -qi "registration\|disconnected\|connected"; then break; fi
            sleep 2
          done
          warp-cli --accept-tos registration new 2>/dev/null || true
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          for i in $(seq 1 30); do
            if warp-cli --accept-tos status 2>/dev/null | grep -qi "^Status update: Connected"; then
              echo "WARP bağlandı! (${i}. deneme)"
              break
            fi
            sleep 3
          done
          if curl -s --max-time 10 https://cloudflare.com/cdn-cgi/trace 2>/dev/null | grep -q "warp=on"; then
            echo "WARP tünel aktif!"
          else
            echo "::warning::WARP başlatılamadı — proxy'siz devam ediliyor"
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update yt-dlp & pytubefix to latest
        run: pip install -U "yt-dlp[default]" pytubefix

      - name: Write YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > yt_cookies.txt
          fi

      - name: Download Arabic font
        run: python -c "from setup_assets import download_arabic_font; download_arabic_font()"

      - name: Run Arabic pipeline
        run: python main.py
        env:
          TOPIC_KEYWORDS: ${{ vars.TOPIC_KEYWORDS || 'Israel,Gaza,Hamas,Hezbollah,IDF,West Bank,Jerusalem,Iran,IRGC,Iran nuclear,Iran missile,Iran US,Iran Israel,Iranian' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          LANGUAGE: ar
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_QUEUE: ${{ vars.USE_QUEUE || 'false' }}
          GOOGLE_DRIVE_BACKUP: ${{ vars.GOOGLE_DRIVE_BACKUP || 'false' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COMPETITOR_CHANNEL_IDS: ${{ vars.COMPETITOR_CHANNEL_IDS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TRANSLATE_LANGUAGES: ${{ vars.TRANSLATE_LANGUAGES || 'es,fr,pt' }}

      - name: Save last_video cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/last_video.json
          key: last-video-ar-${{ github.run_id }}

      - name: Save RSS state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: rss_state.json
          key: rss-state-ar-${{ github.run_id }}

      - name: Save playlist IDs cache
        if: always()
        uses: actions/cache@v4
        with:
          path: playlist_ids.json
          key: playlist-ids-ar-${{ github.run_id }}

      - name: Save used_topics cache
        if: always()
        uses: actions/cache@v4
        with:
          path: used_topics.json
          key: used-topics-ar-${{ github.run_id }}

      - name: Save seen clip IDs cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output/seen_clip_ids.json
          key: seen-clip-ids-ar-${{ github.run_id }}

      - name: Commit used_topics.json to git (kalıcı dedup)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --cached --quiet || git commit -m "chore: update used_topics after arabic run [skip ci]"
          git pull --rebase origin $(git rev-parse --abbrev-ref HEAD) || true
          git push origin HEAD || true

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-pipeline-output-${{ github.run_id }}
          path: output/
          retention-days: 7
